advanced:
  caching:
    cache_cluster_trees: false
    cache_directory: results/cache
    enabled: true
  ensure_deterministic: true
  epsilon_numerical: 1e-10
  float_precision: float64
  validation_level: 2
export:
  add_timestamp: true
  base_directory: results
  clustering:
    export_cluster_mapping: false
    export_tree_structure: false
  files:
    circuit_images: false
    clustering_report: false
    convergence_history: true
    final_metrics: true
    optimal_weights: true
    per_level_weights: false
    recursive_tree: false
  formats:
    csv: true
    excel: false
    json: true
  run_subdirectory: exp_S1_PC_100
global:
  alpha: 0.05
  author: Ignacio Lopez Leis
  constraints:
    long_only: true
    max_weight: 0.3
    min_weight: 0.0
    sum_to_one: true
  debug_mode: false
  institution: Universidad Autonoma de Madrid
  project_name: Quantum Portfolio Optimization with CVaR
  project_version: '5.2'
  random_seed: 42
  verbose: true
phase0:
  clustering:
    algorithm: hierarchical
    auto_enable_threshold: 999
    cluster_return_method: tail_weighted
    enabled: false
    linkage_method: ward
    max_clusters: 10
    method: tail_dependence
    min_cluster_size: 2
    min_clusters: 2
    n_clusters: null
  data:
    csv_path: data/returns_sp500_full.csv
    end_date: '2025-12-31'
    frequency: daily
    handle_missing: ffill
    min_observations: 250
    portfolio_name: exp_S1_PC_100
    source: yahoo_finance
    start_date: '2018-01-01'
    tickers:
    - AAPL
    - MSFT
    - GOOGL
